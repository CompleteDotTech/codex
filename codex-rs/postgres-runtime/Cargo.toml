[package]
name = "codex-postgres-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
doctest = false

[lints]
workspace = true

[dependencies]
ed25519-dalek = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
sqlx = { workspace = true, features = ["postgres"] }
sqlx-macros = { workspace = true }
sqlx-postgres = { workspace = true }
sqlx-sqlite = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "sync"] }
zeroize = { workspace = true }

[dev-dependencies]
libc = { workspace = true }
pretty_assertions = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["io-util", "net", "process"] }
