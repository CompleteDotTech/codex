name: Storage tools

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    name: Offline tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python }}

      - name: Find Git OpenSSL on Windows
        if: runner.os == 'Windows' && hashFiles('scripts/postgres/**/*.py') != ''
        shell: pwsh
        run: |
          $gitRoot = Split-Path (Split-Path (Get-Command git).Source)
          $openssl = Join-Path $gitRoot 'usr/bin/openssl.exe'
          if (!(Test-Path -LiteralPath $openssl)) {
            throw 'Git OpenSSL is required for the storage state tests'
          }
          Split-Path $openssl | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify OpenSSL
        if: hashFiles('scripts/postgres/**/*.py') != ''
        run: openssl version

      - name: Test offline storage contracts
        if: hashFiles('scripts/storage_contract/**/*.py') != ''
        run: python -m unittest discover -s scripts/storage_contract -t scripts -v

      - name: Test PostgreSQL management helpers without Docker
        if: hashFiles('scripts/postgres/**/*.py') != ''
        run: python -m unittest discover -s scripts/postgres/tests -v

      - name: Check PostgreSQL shell syntax
        if: hashFiles('scripts/postgres/container/*.sh') != ''
        shell: bash
        run: |
          set -euo pipefail
          for script in scripts/postgres/container/*.sh; do
            bash -n "$script"
          done

      - name: Check for a clean worktree
        if: always() && !cancelled()
        uses: ./.github/actions/check-clean-worktree

  workflows:
    name: Workflow validation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@44c6d64aa62cd779e873306675c7a58e86d6d532 # v2.62.49
        with:
          tool: actionlint@1.7.12
      - name: Check storage workflow definitions
        run: >-
          actionlint -color -shellcheck=""
          .github/workflows/blocking-ci.yml
          .github/workflows/postmerge-ci.yml
          .github/workflows/storage-tools.yml
      - name: Test check selection
        run: python3 -m unittest discover -s .github/scripts -p test_storage_ci_paths.py -v
