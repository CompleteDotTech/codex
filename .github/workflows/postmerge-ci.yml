name: postmerge-ci

# This is the single entrypoint for main-only CI that is intentionally outside
# the merge-blocking suite. It keeps the broader postmerge signal in one run.
on:
  push:
    branches: [main]

jobs:
  changed:
    name: Select checks
    runs-on: ubuntu-24.04
    outputs:
      native: ${{ steps.select.outputs.native }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test check selection
        run: python3 -m unittest discover -s .github/scripts -p test_storage_ci_paths.py -v
      - name: Select checks for the changed files
        id: select
        env:
          BASE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
        run: python3 .github/scripts/storage_ci_paths.py

  # Keep reusable workflow calls alphabetized. Each child retains its own
  # workflow_dispatch trigger so maintainers can rerun flaky suites directly.
  # Storage tooling and CI routing are validated by blocking-ci's hosted matrix.
  rust-ci-full:
    name: rust-ci-full
    needs: changed
    if: needs.changed.outputs.native == 'true'
    uses: ./.github/workflows/rust-ci-full.yml
    secrets: inherit

  v8-canary:
    name: v8-canary
    # Reusable jobs cannot request permissions beyond their caller's grant.
    permissions:
      contents: read
      actions: read
    needs: changed
    if: needs.changed.outputs.native == 'true'
    uses: ./.github/workflows/v8-canary.yml
    secrets: inherit

  results:
    name: Postmerge CI results
    needs:
      - changed
      - rust-ci-full
      - v8-canary
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      # Postmerge runs use the pushed main commit, so this helper always comes
      # from the same revision that defined the parent workflow.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Require successful dependencies
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/storage_ci_paths.py --require
