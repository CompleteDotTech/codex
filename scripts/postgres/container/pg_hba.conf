# Unix socket administration stays inside this dedicated container.
local   all     postgres                        peer
local   all     all                             reject
hostnossl all    all             0.0.0.0/0       reject
hostnossl all    all             ::/0            reject
hostssl codex   codex_runtime,codex_migrator,codex_backup 0.0.0.0/0 scram-sha-256
hostssl codex   codex_runtime,codex_migrator,codex_backup ::/0      scram-sha-256
host    all     all             0.0.0.0/0       reject
host    all     all             ::/0            reject
